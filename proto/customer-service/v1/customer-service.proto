syntax = "proto3";

package customer_service .v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/customer_service /v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum Gender {
	GENDER_UNSPECIFIED = 0;
	MALE = 1;
	FEMALE = 2;
	OTHER = 3;
	PREFER_NOT_TO_SAY = 4;
}

message Customer {
	string id = 1;
	string user_id = 2;
	string first_name = 3;
	string last_name = 4;
	string phone = 5;
	date birth_date = 6;
	Gender gender = 7;
	string profile_image_url = 8;
	string profile_thumbnail_100_url = 9;
	string profile_thumbnail_200_url = 10;
	google.protobuf.Timestamp created_at = 11;
	google.protobuf.Timestamp updated_at = 12;
}

message Address {
	string id = 1;
	string customer_id = 2;
	string address_name = 3;
	string postal_code = 4;
	string prefecture = 5;
	string city = 6;
	string address_line1 = 7;
	string address_line2 = 8;
	string recipient_name = 9;
	string recipient_phone = 10;
	bool is_default = 11;
	bool deleted = 12;
	google.protobuf.Timestamp created_at = 13;
	google.protobuf.Timestamp updated_at = 14;
}

message CartItem {
	string id = 1;
	string customer_id = 2;
	string product_id = 3;
	string variation_id = 4;
	int32 quantity = 5;
	google.protobuf.Timestamp expires_at = 6;
	google.protobuf.Timestamp created_at = 7;
	google.protobuf.Timestamp updated_at = 8;
}

message GuestCartItem {
	string id = 1;
	string session_id = 2;
	string product_id = 3;
	string variation_id = 4;
	int32 quantity = 5;
	google.protobuf.Timestamp expires_at = 6;
	google.protobuf.Timestamp created_at = 7;
}

message Favorite {
	string id = 1;
	string customer_id = 2;
	string product_id = 3;
	bool notify_on_restock = 4;
	google.protobuf.Timestamp created_at = 5;
}

message PaymentMethod {
	string id = 1;
	string customer_id = 2;
	string stripe_payment_method_id = 3;
	string card_last4 = 4;
	string card_brand = 5;
	int32 card_exp_month = 6;
	int32 card_exp_year = 7;
	string cardholder_name = 8;
	bool is_default = 9;
	google.protobuf.Timestamp created_at = 10;
	google.protobuf.Timestamp updated_at = 11;
}

message Review {
	string id = 1;
	string customer_id = 2;
	string product_id = 3;
	string order_id = 4;
	int32 rating = 5;
	text review_text = 6;
	repeated string image_urls = 7;
	google.protobuf.Timestamp editable_until = 8;
	google.protobuf.Timestamp created_at = 9;
	google.protobuf.Timestamp updated_at = 10;
}

message GetCustomerProfileRequest {
	string customer_id = 1;
}

message UpdateCustomerProfileRequest {
	string customer_id = 1;
	string first_name = 2;
	string last_name = 3;
	string phone = 4;
	date birth_date = 5;
	Gender gender = 6;
}

message UploadProfileImageRequest {
	string customer_id = 1;
	bytes image_data = 2;
}

message RegisterAddressRequest {
	string customer_id = 1;
	string address_name = 2;
	string postal_code = 3;
	string prefecture = 4;
	string city = 5;
	string address_line1 = 6;
	string address_line2 = 7;
	string recipient_name = 8;
	string recipient_phone = 9;
	bool is_default = 10;
}

message UpdateAddressRequest {
	string address_id = 1;
	string customer_id = 2;
	string address_name = 3;
	string postal_code = 4;
	string prefecture = 5;
	string city = 6;
	string address_line1 = 7;
	string address_line2 = 8;
	string recipient_name = 9;
	string recipient_phone = 10;
	bool is_default = 11;
}

message DeleteAddressRequest {
	string address_id = 1;
	string customer_id = 2;
}

message SearchPostalCodeRequest {
	string postal_code = 1;
}

message AddToCartRequest {
	string customer_id = 1;
	string product_id = 2;
	string variation_id = 3;
	int32 quantity = 4;
}

message GetCartRequest {
	string customer_id = 1;
}

message UpdateCartItemQuantityRequest {
	string cart_item_id = 1;
	string customer_id = 2;
	int32 quantity = 3;
}

message RemoveFromCartRequest {
	string cart_item_id = 1;
	string customer_id = 2;
}

message MergeGuestCartRequest {
	string customer_id = 1;
	string session_id = 2;
}

message AddToFavoriteRequest {
	string customer_id = 1;
	string product_id = 2;
	bool notify_on_restock = 3;
}

message GetFavoritesRequest {
	string customer_id = 1;
	string sort_by = 2;
	string sort_order = 3;
}

message RemoveFromFavoriteRequest {
	string favorite_id = 1;
	string customer_id = 2;
}

message GetOrderHistoryRequest {
	string customer_id = 1;
	string status_filter = 2;
	date date_from = 3;
	date date_to = 4;
	int32 page = 5;
	int32 page_size = 6;
}

message GetOrderDetailRequest {
	string order_id = 1;
	string customer_id = 2;
}

message RequestOrderCancelRequest {
	string order_id = 1;
	string customer_id = 2;
	string cancel_reason = 3;
}

message ReorderFromHistoryRequest {
	string order_id = 1;
	string customer_id = 2;
}

message RegisterPaymentMethodRequest {
	string customer_id = 1;
	string stripe_payment_method_id = 2;
	bool is_default = 3;
}

message DeletePaymentMethodRequest {
	string payment_method_id = 1;
	string customer_id = 2;
}

message PostReviewRequest {
	string customer_id = 1;
	string product_id = 2;
	string order_id = 3;
	int32 rating = 4;
	string review_text = 5;
	repeated string image_urls = 6;
}

message UpdateReviewRequest {
	string review_id = 1;
	string customer_id = 2;
	int32 rating = 3;
	string review_text = 4;
	repeated string image_urls = 5;
}

message GetMyReviewsRequest {
	string customer_id = 1;
}

service CustomerService  {
	rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
	rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
	rpc UploadProfileImage(UploadProfileImageRequest) returns (UploadProfileImageResponse);
	rpc RegisterAddress(RegisterAddressRequest) returns (RegisterAddressResponse);
	rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
	rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
	rpc SearchPostalCode(SearchPostalCodeRequest) returns (SearchPostalCodeResponse);
	rpc AddToCart(AddToCartRequest) returns (AddToCartResponse);
	rpc GetCart(GetCartRequest) returns (GetCartResponse);
	rpc UpdateCartItemQuantity(UpdateCartItemQuantityRequest) returns (UpdateCartItemQuantityResponse);
	rpc RemoveFromCart(RemoveFromCartRequest) returns (RemoveFromCartResponse);
	rpc MergeGuestCart(MergeGuestCartRequest) returns (MergeGuestCartResponse);
	rpc AddToFavorite(AddToFavoriteRequest) returns (AddToFavoriteResponse);
	rpc GetFavorites(GetFavoritesRequest) returns (GetFavoritesResponse);
	rpc RemoveFromFavorite(RemoveFromFavoriteRequest) returns (RemoveFromFavoriteResponse);
	rpc GetOrderHistory(GetOrderHistoryRequest) returns (GetOrderHistoryResponse);
	rpc GetOrderDetail(GetOrderDetailRequest) returns (GetOrderDetailResponse);
	rpc RequestOrderCancel(RequestOrderCancelRequest) returns (RequestOrderCancelResponse);
	rpc ReorderFromHistory(ReorderFromHistoryRequest) returns (ReorderFromHistoryResponse);
	rpc RegisterPaymentMethod(RegisterPaymentMethodRequest) returns (RegisterPaymentMethodResponse);
	rpc DeletePaymentMethod(DeletePaymentMethodRequest) returns (DeletePaymentMethodResponse);
	rpc PostReview(PostReviewRequest) returns (PostReviewResponse);
	rpc UpdateReview(UpdateReviewRequest) returns (UpdateReviewResponse);
	rpc GetMyReviews(GetMyReviewsRequest) returns (GetMyReviewsResponse);
}
