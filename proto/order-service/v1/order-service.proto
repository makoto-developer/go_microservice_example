syntax = "proto3";

package order_service.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/order_service/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum OrderStatus {
	ORDER_STATUS_UNSPECIFIED = 0;
	PENDING = 1;
	PAYMENT_PROCESSING = 2;
	PAYMENT_FAILED = 3;
	CONFIRMED = 4;
	PREPARING = 5;
	SHIPPED = 6;
	DELIVERED = 7;
	CANCELLED = 8;
}

enum PaymentMethod {
	PAYMENT_METHOD_UNSPECIFIED = 0;
	CREDIT_CARD = 1;
	CASH_ON_DELIVERY = 2;
}

enum CancelReason {
	CANCEL_REASON_UNSPECIFIED = 0;
	CUSTOMER_NO_LONGER_NEEDED = 1;
	CUSTOMER_ORDERED_BY_MISTAKE = 2;
	CUSTOMER_DELIVERY_TIME_ISSUE = 3;
	CUSTOMER_OTHER = 4;
	SHOP_OUT_OF_STOCK = 5;
	SHOP_DEFECTIVE_PRODUCT = 6;
	SHOP_OTHER = 7;
}

enum SagaType {
	SAGA_TYPE_UNSPECIFIED = 0;
	CREATE_ORDER = 1;
	CANCEL_ORDER = 2;
}

enum SagaStatus {
	SAGA_STATUS_UNSPECIFIED = 0;
	STARTED = 1;
	COMPENSATING = 2;
	COMPLETED = 3;
	FAILED = 4;
}

message Order {
	string id = 1;
	string order_number = 2;
	string customer_id = 3;
	string customer_email = 4;
	OrderStatus status = 5;
	string total_amount = 6;
	string subtotal = 7;
	string shipping_fee = 8;
	PaymentMethod payment_method = 9;
	string payment_id = 10;
	string shipping_method = 11;
	string shipping_address = 12;
	string recipient_name = 13;
	string recipient_phone = 14;
	string tracking_number = 15;
	string carrier = 16;
	string notes = 17;
	google.protobuf.Timestamp created_at = 18;
	google.protobuf.Timestamp updated_at = 19;
}

message OrderItem {
	string id = 1;
	string order_id = 2;
	string shop_id = 3;
	string product_id = 4;
	string variation_id = 5;
	string product_name = 6;
	string product_snapshot = 7;  // JSON format
	string unit_price = 8;
	int32 quantity = 9;
	string subtotal = 10;
	google.protobuf.Timestamp created_at = 11;
}

message OrderStatusHistory {
	string id = 1;
	string order_id = 2;
	OrderStatus old_status = 3;
	OrderStatus new_status = 4;
	string changed_by = 5;
	string change_reason = 6;
	google.protobuf.Timestamp created_at = 7;
}

message OrderCancellation {
	string id = 1;
	string order_id = 2;
	string cancelled_by = 3;
	CancelReason cancel_reason = 4;
	string cancel_note = 5;
	string refund_id = 6;
	google.protobuf.Timestamp created_at = 7;
}

message SagaState {
	string id = 1;
	string order_id = 2;
	SagaType saga_type = 3;
	string current_step = 4;
	SagaStatus status = 5;
	string compensation_data = 6;  // JSON format
	string error_message = 7;
	google.protobuf.Timestamp created_at = 8;
	google.protobuf.Timestamp updated_at = 9;
}

message CreateOrderRequest {
	string customer_id = 1;
	string customer_email = 2;
	repeated CartItemInput cart_items = 3;
	string shipping_address_id = 4;
	PaymentMethod payment_method = 5;
	string payment_method_id = 6;
	string shipping_method = 7;
	string notes = 8;
}

message GetOrderDetailRequest {
	string order_id = 1;
	string requester_id = 2;
	string requester_role = 3;
}

message ListOrdersRequest {
	string customer_id = 1;
	string shop_id = 2;
	repeated OrderStatus status_filter = 3;
	string date_from = 4;  // YYYY-MM-DD format
	string date_to = 5;  // YYYY-MM-DD format
	string search_query = 6;
	string sort_by = 7;
	string sort_order = 8;
	int32 page = 9;
	int32 page_size = 10;
}

message UpdateOrderStatusRequest {
	string order_id = 1;
	OrderStatus new_status = 2;
	string changed_by = 3;
	string change_reason = 4;
	string tracking_number = 5;
	string carrier = 6;
}

message GetOrderStatusHistoryRequest {
	string order_id = 1;
}

message CancelOrderRequest {
	string order_id = 1;
	string cancelled_by = 2;
	CancelReason cancel_reason = 3;
	string cancel_note = 4;
}

message SearchOrdersRequest {
	string shop_id = 1;
	string order_number = 2;
	string customer_name = 3;
	string customer_email = 4;
	string product_name = 5;
	string date_from = 6;  // YYYY-MM-DD format
	string date_to = 7;  // YYYY-MM-DD format
	repeated OrderStatus status_filter = 8;
	string min_amount = 9;
	string max_amount = 10;
	int32 page = 11;
	int32 page_size = 12;
}

message GetOrderStatisticsRequest {
	string shop_id = 1;
	string date_from = 2;  // YYYY-MM-DD format
	string date_to = 3;  // YYYY-MM-DD format
	string group_by = 4;
}

message GetProductSalesRankingRequest {
	string shop_id = 1;
	string date_from = 2;  // YYYY-MM-DD format
	string date_to = 3;  // YYYY-MM-DD format
	int32 limit = 4;
}

message ExportOrdersToCSVRequest {
	string shop_id = 1;
	string date_from = 2;  // YYYY-MM-DD format
	string date_to = 3;  // YYYY-MM-DD format
	repeated OrderStatus status_filter = 4;
}

message CreateReorderRequest {
	string customer_id = 1;
	string original_order_id = 2;
}

service OrderService  {
	rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
	rpc GetOrderDetail(GetOrderDetailRequest) returns (GetOrderDetailResponse);
	rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
	rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
	rpc GetOrderStatusHistory(GetOrderStatusHistoryRequest) returns (GetOrderStatusHistoryResponse);
	rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
	rpc SearchOrders(SearchOrdersRequest) returns (SearchOrdersResponse);
	rpc GetOrderStatistics(GetOrderStatisticsRequest) returns (GetOrderStatisticsResponse);
	rpc GetProductSalesRanking(GetProductSalesRankingRequest) returns (GetProductSalesRankingResponse);
	rpc ExportOrdersToCSV(ExportOrdersToCSVRequest) returns (ExportOrdersToCSVResponse);
	rpc CreateReorder(CreateReorderRequest) returns (CreateReorderResponse);
}

// Response messages (auto-generated)
message CreateOrderResponse {
	string order_id = 1;
	string order_number = 2;
	string message = 3;
}

message GetOrderDetailResponse {
	Order order = 1;
}

message ListOrdersResponse {
	repeated Order orders = 1;
	int32 total_count = 2;
	int32 page = 3;
	int32 page_size = 4;
}

message UpdateOrderStatusResponse {
	bool success = 1;
	string message = 2;
}

message GetOrderStatusHistoryResponse {
	repeated OrderStatus history = 1;
}

message CancelOrderResponse {
	bool success = 1;
	string message = 2;
}

message SearchOrdersResponse {
	repeated Order orders = 1;
	int32 total_count = 2;
}

message GetOrderStatisticsResponse {
	int32 total_orders = 1;
	int64 total_sales = 2;
	int32 pending_orders = 3;
	int32 completed_orders = 4;
}

message GetProductSalesRankingResponse {
	repeated ProductSalesRank rankings = 1;
}

message ProductSalesRank {
	string product_id = 1;
	string product_name = 2;
	int32 total_sold = 3;
	int64 total_revenue = 4;
}

message ExportOrdersToCSVResponse {
	string csv_url = 1;
	string message = 2;
}

message CreateReorderResponse {
	string order_id = 1;
	string message = 2;
}

// Additional message types
message CartItemInput {
	string product_id = 1;
	string variation_id = 2;
	int32 quantity = 3;
	int64 unit_price = 4;
}
