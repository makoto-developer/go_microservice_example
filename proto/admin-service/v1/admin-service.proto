syntax = "proto3";

package admin_service.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/admin_service/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum SettingType {
	SETTING_TYPE_UNSPECIFIED = 0;
	STRING = 1;
	NUMBER = 2;
	BOOLEAN = 3;
	JSON = 4;
}

enum WordContext {
	WORD_CONTEXT_UNSPECIFIED = 0;
	REVIEW = 1;
	CHAT = 2;
	ALL = 3;
}

enum Severity {
	SEVERITY_UNSPECIFIED = 0;
	LOW = 1;
	MEDIUM = 2;
	HIGH = 3;
	CRITICAL = 4;
}

enum OperationType {
	OPERATION_TYPE_UNSPECIFIED = 0;
	USER_CREATED = 1;
	USER_UPDATED = 2;
	USER_ROLE_CHANGED = 3;
	USER_SUSPENDED = 4;
	USER_ACTIVATED = 5;
	SHOP_APPROVED = 6;
	SHOP_REJECTED = 7;
	SHOP_SUSPENDED = 8;
	SHOP_ACTIVATED = 9;
	SETTING_UPDATED = 10;
	CATEGORY_CREATED = 11;
	CATEGORY_UPDATED = 12;
	CATEGORY_DELETED = 13;
	REVIEW_APPROVED = 14;
	REVIEW_REJECTED = 15;
	REVIEW_DELETED = 16;
}

enum MetricType {
	METRIC_TYPE_UNSPECIFIED = 0;
	TOTAL_USERS = 1;
	ACTIVE_USERS = 2;
	TOTAL_SHOPS = 3;
	ACTIVE_SHOPS = 4;
	TOTAL_ORDERS = 5;
	TOTAL_REVENUE = 6;
	DAILY_ORDERS = 7;
	DAILY_REVENUE = 8;
	NEW_USERS = 9;
	NEW_SHOPS = 10;
}

enum HealthStatus {
	HEALTH_STATUS_UNSPECIFIED = 0;
	HEALTHY = 1;
	DEGRADED = 2;
	UNHEALTHY = 3;
}

message SystemSettings {
	string id = 1;
	string setting_key = 2;
	string setting_value = 3;
	SettingType setting_type = 4;
	string description = 5;
	string updated_by = 6;
	google.protobuf.Timestamp created_at = 7;
	google.protobuf.Timestamp updated_at = 8;
}

message Category {
	string id = 1;
	string name = 2;
	string parent_id = 3;
	int32 level = 4;
	int32 display_order = 5;
	bool is_active = 6;
	google.protobuf.Timestamp created_at = 7;
	google.protobuf.Timestamp updated_at = 8;
}

message ForbiddenWord {
	string id = 1;
	string word = 2;
	WordContext context = 3;
	Severity severity = 4;
	google.protobuf.Timestamp created_at = 5;
}

message AuditLog {
	string id = 1;
	OperationType operation_type = 2;
	string operator_id = 3;
	string operator_name = 4;
	string target_type = 5;
	string target_id = 6;
	string operation_detail = 7;  // JSON format
	string ip_address = 8;
	string user_agent = 9;
	google.protobuf.Timestamp created_at = 10;
}

message DashboardMetrics {
	string id = 1;
	MetricType metric_type = 2;
	string metric_value = 3;
	string metric_date = 4;  // YYYY-MM-DD format
	string metadata = 5;  // JSON format
	google.protobuf.Timestamp created_at = 6;
}

message ServiceHealthCheck {
	string id = 1;
	string service_name = 2;
	HealthStatus status = 3;
	int32 response_time_ms = 4;
	string error_message = 5;
	google.protobuf.Timestamp checked_at = 6;
}

message GetAllUsersRequest {
	string role_filter = 1;
	string status_filter = 2;
	bool email_verified = 3;
	string date_from = 4;  // YYYY-MM-DD format
	string date_to = 5;  // YYYY-MM-DD format
	string sort_by = 6;
	int32 page = 7;
	int32 page_size = 8;
}

message GetUserDetailRequest {
	string user_id = 1;
}

message ChangeUserRoleRequest {
	string user_id = 1;
	string admin_id = 2;
	string new_role = 3;
	string reason = 4;
}

message SuspendUserRequest {
	string user_id = 1;
	string admin_id = 2;
	string reason = 3;
}

message ActivateUserRequest {
	string user_id = 1;
	string admin_id = 2;
	string reason = 3;
}

message GetPendingShopsRequest {
	int32 page = 1;
	int32 page_size = 2;
}

message ApproveShopRequest {
	string shop_id = 1;
	string admin_id = 2;
}

message RejectShopRequest {
	string shop_id = 1;
	string admin_id = 2;
	string reason = 3;
}

message GetAllShopsRequest {
	string approval_status = 1;
	string status_filter = 2;
	string category = 3;
	string date_from = 4;  // YYYY-MM-DD format
	string date_to = 5;  // YYYY-MM-DD format
	string sort_by = 6;
	int32 page = 7;
	int32 page_size = 8;
}

message SuspendShopRequest {
	string shop_id = 1;
	string admin_id = 2;
	string reason = 3;
}

message ActivateShopRequest {
	string shop_id = 1;
	string admin_id = 2;
	string reason = 3;
}

message GetSystemSettingsRequest {}

message GetSystemSettingsResponse {
	repeated SystemSettings settings = 2;
}

message UpdateSystemSettingRequest {
	string admin_id = 1;
	string setting_key = 2;
	string setting_value = 3;
}

message GetCategoriesRequest {}

message GetCategoriesResponse {
	repeated Category categories = 2;
}

message CreateCategoryRequest {
	string admin_id = 1;
	string name = 2;
	string parent_id = 3;
	int32 display_order = 4;
}

message UpdateCategoryRequest {
	string admin_id = 1;
	string category_id = 2;
	string name = 3;
	int32 display_order = 4;
}

message DeleteCategoryRequest {
	string admin_id = 1;
	string category_id = 2;
}

message GetForbiddenWordsRequest {
	WordContext context = 1;
}

message AddForbiddenWordRequest {
	string admin_id = 1;
	string word = 2;
	WordContext context = 3;
	Severity severity = 4;
}

message DeleteForbiddenWordRequest {
	string admin_id = 1;
	string word_id = 2;
}

message GetDashboardMetricsRequest {
	string date = 1;  // YYYY-MM-DD format
}

message GetSalesChartRequest {
	string date_from = 1;  // YYYY-MM-DD format
	string date_to = 2;  // YYYY-MM-DD format
	string group_by = 3;
}

message GetServiceHealthRequest {}

message GetServiceHealthResponse {
	repeated ServiceHealthCheck services = 2;
}

message PerformHealthCheckRequest {}

message PerformHealthCheckResponse {
	repeated ServiceHealthCheck results = 2;
}

message RecordAuditLogRequest {
	OperationType operation_type = 1;
	string operator_id = 2;
	string operator_name = 3;
	string target_type = 4;
	string target_id = 5;
	map<string, string> operation_detail = 6;
	string ip_address = 7;
	string user_agent = 8;
}

message GetAuditLogsRequest {
	OperationType operation_type = 1;
	string operator_id = 2;
	string target_type = 3;
	string date_from = 4;  // YYYY-MM-DD format
	string date_to = 5;  // YYYY-MM-DD format
	int32 page = 6;
	int32 page_size = 7;
}

message ExportAuditLogsRequest {
	string date_from = 1;  // YYYY-MM-DD format
	string date_to = 2;  // YYYY-MM-DD format
}

message GenerateSalesReportRequest {
	string date_from = 1;  // YYYY-MM-DD format
	string date_to = 2;  // YYYY-MM-DD format
	string report_type = 3;
}

message GenerateUserReportRequest {
	string date_from = 1;  // YYYY-MM-DD format
	string date_to = 2;  // YYYY-MM-DD format
}

message ExportReportRequest {
	string report_type = 1;
	string date_from = 2;  // YYYY-MM-DD format
	string date_to = 3;  // YYYY-MM-DD format
	string format = 4;
}

service AdminService  {
	rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse);
	rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailResponse);
	rpc ChangeUserRole(ChangeUserRoleRequest) returns (ChangeUserRoleResponse);
	rpc SuspendUser(SuspendUserRequest) returns (SuspendUserResponse);
	rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse);
	rpc GetPendingShops(GetPendingShopsRequest) returns (GetPendingShopsResponse);
	rpc ApproveShop(ApproveShopRequest) returns (ApproveShopResponse);
	rpc RejectShop(RejectShopRequest) returns (RejectShopResponse);
	rpc GetAllShops(GetAllShopsRequest) returns (GetAllShopsResponse);
	rpc SuspendShop(SuspendShopRequest) returns (SuspendShopResponse);
	rpc ActivateShop(ActivateShopRequest) returns (ActivateShopResponse);
	rpc GetSystemSettings(GetSystemSettingsRequest) returns (GetSystemSettingsResponse);
	rpc UpdateSystemSetting(UpdateSystemSettingRequest) returns (UpdateSystemSettingResponse);
	rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
	rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
	rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
	rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
	rpc GetForbiddenWords(GetForbiddenWordsRequest) returns (GetForbiddenWordsResponse);
	rpc AddForbiddenWord(AddForbiddenWordRequest) returns (AddForbiddenWordResponse);
	rpc DeleteForbiddenWord(DeleteForbiddenWordRequest) returns (DeleteForbiddenWordResponse);
	rpc GetDashboardMetrics(GetDashboardMetricsRequest) returns (GetDashboardMetricsResponse);
	rpc GetSalesChart(GetSalesChartRequest) returns (GetSalesChartResponse);
	rpc GetServiceHealth(GetServiceHealthRequest) returns (GetServiceHealthResponse);
	rpc GetAuditLogs(GetAuditLogsRequest) returns (GetAuditLogsResponse);
	rpc ExportAuditLogs(ExportAuditLogsRequest) returns (ExportAuditLogsResponse);
	rpc GenerateSalesReport(GenerateSalesReportRequest) returns (GenerateSalesReportResponse);
	rpc GenerateUserReport(GenerateUserReportRequest) returns (GenerateUserReportResponse);
	rpc ExportReport(ExportReportRequest) returns (ExportReportResponse);
}

// Auto-generated response messages

message GetAllUsersResponse {
	bool success = 1;
	string message = 2;
}

message GetUserDetailResponse {
	bool success = 1;
	string message = 2;
}

message ChangeUserRoleResponse {
	bool success = 1;
	string message = 2;
}

message SuspendUserResponse {
	bool success = 1;
	string message = 2;
}

message ActivateUserResponse {
	bool success = 1;
	string message = 2;
}

message GetPendingShopsResponse {
	bool success = 1;
	string message = 2;
}

message ApproveShopResponse {
	bool success = 1;
	string message = 2;
}

message RejectShopResponse {
	bool success = 1;
	string message = 2;
}

message GetAllShopsResponse {
	bool success = 1;
	string message = 2;
}

message SuspendShopResponse {
	bool success = 1;
	string message = 2;
}

message ActivateShopResponse {
	bool success = 1;
	string message = 2;
}

message UpdateSystemSettingResponse {
	bool success = 1;
	string message = 2;
}

message CreateCategoryResponse {
	bool success = 1;
	string message = 2;
}

message UpdateCategoryResponse {
	bool success = 1;
	string message = 2;
}

message DeleteCategoryResponse {
	bool success = 1;
	string message = 2;
}

message GetForbiddenWordsResponse {
	bool success = 1;
	string message = 2;
}

message AddForbiddenWordResponse {
	bool success = 1;
	string message = 2;
}

message DeleteForbiddenWordResponse {
	bool success = 1;
	string message = 2;
}

message GetDashboardMetricsResponse {
	bool success = 1;
	string message = 2;
}

message GetSalesChartResponse {
	bool success = 1;
	string message = 2;
}

message GetAuditLogsResponse {
	bool success = 1;
	string message = 2;
}

message ExportAuditLogsResponse {
	bool success = 1;
	string message = 2;
}

message GenerateSalesReportResponse {
	bool success = 1;
	string message = 2;
}

message GenerateUserReportResponse {
	bool success = 1;
	string message = 2;
}

message ExportReportResponse {
	bool success = 1;
	string message = 2;
}
