syntax = "proto3";

package shipping_service.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/shipping_service/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum Carrier {
	CARRIER_UNSPECIFIED = 0;
	YAMATO = 1;
	SAGAWA = 2;
	JAPAN_POST = 3;
	CLICKPOST = 4;
	NEKOPOS = 5;
}

enum ShipmentStatus {
	SHIPMENT_STATUS_UNSPECIFIED = 0;
	PREPARING = 1;
	AWAITING_PICKUP = 2;
	IN_TRANSIT = 3;
	AT_DISTRIBUTION_CENTER = 4;
	OUT_FOR_DELIVERY = 5;
	DELIVERED = 6;
	DELIVERY_ATTEMPTED = 7;
	DELIVERY_FAILED = 8;
}

enum TimeSlot {
	TIME_SLOT_UNSPECIFIED = 0;
	MORNING = 1;
	NOON_TO_2PM = 2;
	PM_2_TO_4 = 3;
	PM_4_TO_6 = 4;
	PM_6_TO_8 = 5;
	PM_7_TO_9 = 6;
}

enum DeliveryOption {
	DELIVERY_OPTION_UNSPECIFIED = 0;
	STANDARD = 1;
	FRONT_DOOR = 2;
	DELIVERY_BOX = 3;
	GAS_METER_BOX = 4;
	GIFT_WRAPPING = 5;
}

message ShippingMethod {
	string id = 1;
	string shop_id = 2;
	string name = 3;
	Carrier carrier = 4;
	string base_fee = 5;
	string weight_limit_kg = 6;
	int32 size_limit_cm = 7;
	bool is_active = 8;
	google.protobuf.Timestamp created_at = 9;
	google.protobuf.Timestamp updated_at = 10;
}

message ShippingRate {
	string id = 1;
	string shipping_method_id = 2;
	string prefecture = 3;
	string base_rate = 4;
	string weight_rate_per_kg = 5;
	string size_rate_per_cm = 6;
	google.protobuf.Timestamp created_at = 7;
}

message Shipment {
	string id = 1;
	string order_id = 2;
	string tracking_number = 3;
	Carrier carrier = 4;
	ShipmentStatus status = 5;
	string shipping_address = 6;
	string recipient_name = 7;
	string recipient_phone = 8;
	string delivery_date = 9;  // YYYY-MM-DD format
	TimeSlot delivery_time_slot = 10;
	DeliveryOption delivery_option = 11;
	string shipping_fee = 12;
	google.protobuf.Timestamp dispatched_at = 13;
	google.protobuf.Timestamp delivered_at = 14;
	google.protobuf.Timestamp created_at = 15;
	google.protobuf.Timestamp updated_at = 16;
}

message ShipmentHistory {
	string id = 1;
	string shipment_id = 2;
	ShipmentStatus old_status = 3;
	ShipmentStatus new_status = 4;
	string location = 5;
	string description = 6;
	string updated_by = 7;
	google.protobuf.Timestamp created_at = 8;
}

message CarrierTracking {
	string id = 1;
	string shipment_id = 2;
	string tracking_number = 3;
	Carrier carrier = 4;
	google.protobuf.Timestamp last_updated_at = 5;
	string tracking_data = 6;  // JSON format
	google.protobuf.Timestamp created_at = 7;
	google.protobuf.Timestamp updated_at = 8;
}

message CalculateShippingFeeRequest {
	string shop_id = 1;
	string prefecture = 2;
	string total_weight_kg = 3;
	int32 total_size_cm = 4;
	string subtotal = 5;
}

message CreateShipmentRequest {
	string order_id = 1;
	string shipping_method_id = 2;
	string shipping_address = 3;
	string recipient_name = 4;
	string recipient_phone = 5;
	string delivery_date = 6;  // YYYY-MM-DD format
	TimeSlot delivery_time_slot = 7;
	DeliveryOption delivery_option = 8;
}

message RegisterTrackingNumberRequest {
	string shipment_id = 1;
	string tracking_number = 2;
	Carrier carrier = 3;
}

message UpdateShipmentStatusRequest {
	string shipment_id = 1;
	ShipmentStatus new_status = 2;
	string location = 3;
	string description = 4;
	string updated_by = 5;
}

message GetShipmentDetailRequest {
	string shipment_id = 1;
}

message GetShipmentByOrderRequest {
	string order_id = 1;
}

message SyncCarrierTrackingRequest {
	string shipment_id = 1;
}

message BatchSyncAllShipmentsRequest {}

message BatchSyncAllShipmentsResponse {
	int32 total_synced = 1;
	int32 total_updated = 2;
	repeated string errors = 3;
}

message ValidateAddressRequest {
	string postal_code = 1;
	string prefecture = 2;
	string city = 3;
	string address_line = 4;
}

message NormalizeAddressRequest {
	string postal_code = 1;
	string prefecture = 2;
	string city = 3;
	string address_line = 4;
	string building = 5;
}

service ShippingService  {
	rpc CalculateShippingFee(CalculateShippingFeeRequest) returns (CalculateShippingFeeResponse);
	rpc CreateShipment(CreateShipmentRequest) returns (CreateShipmentResponse);
	rpc RegisterTrackingNumber(RegisterTrackingNumberRequest) returns (RegisterTrackingNumberResponse);
	rpc UpdateShipmentStatus(UpdateShipmentStatusRequest) returns (UpdateShipmentStatusResponse);
	rpc GetShipmentDetail(GetShipmentDetailRequest) returns (GetShipmentDetailResponse);
	rpc GetShipmentByOrder(GetShipmentByOrderRequest) returns (GetShipmentByOrderResponse);
	rpc SyncCarrierTracking(SyncCarrierTrackingRequest) returns (SyncCarrierTrackingResponse);
	rpc ValidateAddress(ValidateAddressRequest) returns (ValidateAddressResponse);
	rpc NormalizeAddress(NormalizeAddressRequest) returns (NormalizeAddressResponse);
}

// Auto-generated response messages

message CalculateShippingFeeResponse {
	bool success = 1;
	string message = 2;
}

message CreateShipmentResponse {
	bool success = 1;
	string message = 2;
}

message RegisterTrackingNumberResponse {
	bool success = 1;
	string message = 2;
}

message UpdateShipmentStatusResponse {
	bool success = 1;
	string message = 2;
}

message GetShipmentDetailResponse {
	bool success = 1;
	string message = 2;
}

message GetShipmentByOrderResponse {
	bool success = 1;
	string message = 2;
}

message SyncCarrierTrackingResponse {
	bool success = 1;
	string message = 2;
}

message ValidateAddressResponse {
	bool success = 1;
	string message = 2;
}

message NormalizeAddressResponse {
	bool success = 1;
	string message = 2;
}
