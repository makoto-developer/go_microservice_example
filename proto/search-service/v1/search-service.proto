syntax = "proto3";

package search_service.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/search_service/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum StockStatus {
	STOCK_STATUS_UNSPECIFIED = 0;
	IN_STOCK = 1;
	LOW_STOCK = 2;
	OUT_OF_STOCK = 3;
}

enum SortBy {
	SORT_BY_UNSPECIFIED = 0;
	RELEVANCE = 1;
	PRICE_ASC = 2;
	PRICE_DESC = 3;
	RATING_DESC = 4;
	NEWEST = 5;
	REVIEW_COUNT_DESC = 6;
}

enum PeriodType {
	PERIOD_TYPE_UNSPECIFIED = 0;
	HOURLY = 1;
	DAILY = 2;
	WEEKLY = 3;
	MONTHLY = 4;
}

message ProductIndex {
	string id = 1;
	string product_id = 2;
	string product_name = 3;
	string description = 4;
	string category = 5;
	repeated string tags = 6;
	string shop_id = 7;
	string shop_name = 8;
	string price = 9;
	string average_rating = 10;
	int32 review_count = 11;
	StockStatus stock_status = 12;
	string image_url = 13;
	google.protobuf.Timestamp indexed_at = 14;
}

message ShopIndex {
	string id = 1;
	string shop_id = 2;
	string shop_name = 3;
	string description = 4;
	repeated string categories = 5;
	string average_rating = 6;
	int32 product_count = 7;
	string logo_url = 8;
	google.protobuf.Timestamp indexed_at = 9;
}

message SearchHistory {
	string id = 1;
	string user_id = 2;
	string keyword = 3;
	int32 result_count = 4;
	string clicked_product_id = 5;
	google.protobuf.Timestamp created_at = 6;
}

message SearchSuggestion {
	string id = 1;
	string keyword = 2;
	int32 search_count = 3;
	string category = 4;
	google.protobuf.Timestamp last_searched_at = 5;
}

message PopularKeyword {
	string id = 1;
	string keyword = 2;
	int32 search_count = 3;
	int32 rank = 4;
	string category = 5;
	PeriodType period_type = 6;
	string period_date = 7;  // YYYY-MM-DD format
	google.protobuf.Timestamp created_at = 8;
}

message SearchProductsRequest {
	string keyword = 1;
	string category = 2;
	string min_price = 3;
	string max_price = 4;
	string min_rating = 5;
	StockStatus stock_status = 6;
	string shop_id = 7;
	SortBy sort_by = 8;
	int32 page = 9;
	int32 page_size = 10;
}

message GetSearchSuggestionsRequest {
	string prefix = 1;
	int32 limit = 2;
}

message SearchShopsRequest {
	string keyword = 1;
	string category = 2;
	string min_rating = 3;
	string sort_by = 4;
	int32 page = 5;
	int32 page_size = 6;
}

message RecordSearchHistoryRequest {
	string user_id = 1;
	string keyword = 2;
	int32 result_count = 3;
	string clicked_product_id = 4;
}

message GetSearchHistoryRequest {
	string user_id = 1;
	int32 limit = 2;
}

message DeleteSearchHistoryRequest {
	string user_id = 1;
	string history_id = 2;
}

message ClearAllSearchHistoryRequest {
	string user_id = 1;
}

message GetPopularKeywordsRequest {
	PeriodType period_type = 1;
	string category = 2;
	int32 limit = 3;
}

message GetTrendingKeywordsRequest {
	int32 limit = 1;
}

message UpdatePopularKeywordsRequest {
	PeriodType period_type = 1;
}

message IndexProductRequest {
	string product_id = 1;
	string product_name = 2;
	string description = 3;
	string category = 4;
	repeated string tags = 5;
	string shop_id = 6;
	string shop_name = 7;
	string price = 8;
	string average_rating = 9;
	int32 review_count = 10;
	StockStatus stock_status = 11;
	string image_url = 12;
}

message UpdateProductIndexRequest {
	string product_id = 1;
	string product_name = 2;
	string description = 3;
	string price = 4;
	string average_rating = 5;
	int32 review_count = 6;
	StockStatus stock_status = 7;
}

message DeleteProductIndexRequest {
	string product_id = 1;
}

message ReindexAllProductsRequest {}

message ReindexAllProductsResponse {
	int32 total_indexed = 2;
	repeated string errors = 3;
}

message IndexShopRequest {
	string shop_id = 1;
	string shop_name = 2;
	string description = 3;
	repeated string categories = 4;
	string average_rating = 5;
	int32 product_count = 6;
	string logo_url = 7;
}

message DeleteShopIndexRequest {
	string shop_id = 1;
}

message RecordSearchLogRequest {
	string user_id = 1;
	string keyword = 2;
	int32 result_count = 3;
	int32 execution_time_ms = 4;
	map<string, string> filters = 5;
}

message GetSearchAnalyticsRequest {
	string date_from = 1;  // YYYY-MM-DD format
	string date_to = 2;  // YYYY-MM-DD format
	string report_type = 3;
}

service SearchService  {
	rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
	rpc GetSearchSuggestions(GetSearchSuggestionsRequest) returns (GetSearchSuggestionsResponse);
	rpc SearchShops(SearchShopsRequest) returns (SearchShopsResponse);
	rpc RecordSearchHistory(RecordSearchHistoryRequest) returns (RecordSearchHistoryResponse);
	rpc GetSearchHistory(GetSearchHistoryRequest) returns (GetSearchHistoryResponse);
	rpc DeleteSearchHistory(DeleteSearchHistoryRequest) returns (DeleteSearchHistoryResponse);
	rpc ClearAllSearchHistory(ClearAllSearchHistoryRequest) returns (ClearAllSearchHistoryResponse);
	rpc GetPopularKeywords(GetPopularKeywordsRequest) returns (GetPopularKeywordsResponse);
	rpc GetTrendingKeywords(GetTrendingKeywordsRequest) returns (GetTrendingKeywordsResponse);
	rpc IndexProduct(IndexProductRequest) returns (IndexProductResponse);
	rpc UpdateProductIndex(UpdateProductIndexRequest) returns (UpdateProductIndexResponse);
	rpc DeleteProductIndex(DeleteProductIndexRequest) returns (DeleteProductIndexResponse);
	rpc IndexShop(IndexShopRequest) returns (IndexShopResponse);
	rpc DeleteShopIndex(DeleteShopIndexRequest) returns (DeleteShopIndexResponse);
	rpc GetSearchAnalytics(GetSearchAnalyticsRequest) returns (GetSearchAnalyticsResponse);
}

// Auto-generated response messages

message SearchProductsResponse {
	bool success = 1;
	string message = 2;
}

message GetSearchSuggestionsResponse {
	bool success = 1;
	string message = 2;
}

message SearchShopsResponse {
	bool success = 1;
	string message = 2;
}

message RecordSearchHistoryResponse {
	bool success = 1;
	string message = 2;
}

message GetSearchHistoryResponse {
	bool success = 1;
	string message = 2;
}

message DeleteSearchHistoryResponse {
	bool success = 1;
	string message = 2;
}

message ClearAllSearchHistoryResponse {
	bool success = 1;
	string message = 2;
}

message GetPopularKeywordsResponse {
	bool success = 1;
	string message = 2;
}

message GetTrendingKeywordsResponse {
	bool success = 1;
	string message = 2;
}

message IndexProductResponse {
	bool success = 1;
	string message = 2;
}

message UpdateProductIndexResponse {
	bool success = 1;
	string message = 2;
}

message DeleteProductIndexResponse {
	bool success = 1;
	string message = 2;
}

message IndexShopResponse {
	bool success = 1;
	string message = 2;
}

message DeleteShopIndexResponse {
	bool success = 1;
	string message = 2;
}

message GetSearchAnalyticsResponse {
	bool success = 1;
	string message = 2;
}
