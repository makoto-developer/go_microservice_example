syntax = "proto3";

package review_service.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/review_service/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum ReviewStatus {
	REVIEW_STATUS_UNSPECIFIED = 0;
	PENDING = 1;
	APPROVED = 2;
	REJECTED = 3;
	DELETED = 4;
}

enum ReportReason {
	REPORT_REASON_UNSPECIFIED = 0;
	INAPPROPRIATE_CONTENT = 1;
	SPAM = 2;
	OFF_TOPIC = 3;
	FALSE_INFORMATION = 4;
	PERSONAL_INFORMATION = 5;
	OTHER = 6;
}

enum ReportStatus {
	REPORT_STATUS_UNSPECIFIED = 0;
	PENDING = 1;
	REVIEWED = 2;
	ACTION_TAKEN = 3;
	DISMISSED = 4;
}

message Review {
	string id = 1;
	string product_id = 2;
	string order_id = 3;
	string customer_id = 4;
	string nickname = 5;
	int32 rating = 6;
	string title = 7;
	text content = 8;
	repeated string image_urls = 9;
	ReviewStatus status = 10;
	string rejection_reason = 11;
	google.protobuf.Timestamp editable_until = 12;
	bool edited = 13;
	bool deleted = 14;
	int32 helpful_count = 15;
	int32 reported_count = 16;
	google.protobuf.Timestamp created_at = 17;
	google.protobuf.Timestamp updated_at = 18;
}

message ReviewImage {
	string id = 1;
	string review_id = 2;
	string url = 3;
	string thumbnail_200_url = 4;
	string thumbnail_400_url = 5;
	int32 display_order = 6;
	google.protobuf.Timestamp created_at = 7;
}

message ReviewEditHistory {
	string id = 1;
	string review_id = 2;
	int32 old_rating = 3;
	int32 new_rating = 4;
	string old_title = 5;
	string new_title = 6;
	text old_content = 7;
	text new_content = 8;
	google.protobuf.Timestamp edited_at = 9;
}

message ShopReply {
	string id = 1;
	string review_id = 2;
	string shop_id = 3;
	text content = 4;
	bool edited = 5;
	google.protobuf.Timestamp created_at = 6;
	google.protobuf.Timestamp updated_at = 7;
}

message ReviewHelpful {
	string id = 1;
	string review_id = 2;
	string user_id = 3;
	google.protobuf.Timestamp created_at = 4;
	(review_id, unique_constraint = 5;
}

message ReviewReport {
	string id = 1;
	string review_id = 2;
	string reporter_id = 3;
	ReportReason reason = 4;
	text description = 5;
	ReportStatus status = 6;
	string resolved_by = 7;
	google.protobuf.Timestamp resolved_at = 8;
	google.protobuf.Timestamp created_at = 9;
}

message ProductRating {
	string id = 1;
	string product_id = 2;
	int32 total_reviews = 3;
	string average_rating = 4;
	int32 rating_1_count = 5;
	int32 rating_2_count = 6;
	int32 rating_3_count = 7;
	int32 rating_4_count = 8;
	int32 rating_5_count = 9;
	int32 reviews_with_images = 10;
	google.protobuf.Timestamp updated_at = 11;
}

message PostReviewRequest {
	string product_id = 1;
	string order_id = 2;
	string customer_id = 3;
	string nickname = 4;
	int32 rating = 5;
	string title = 6;
	string content = 7;
	repeated string image_urls = 8;
}

message UpdateReviewRequest {
	string review_id = 1;
	string customer_id = 2;
	int32 rating = 3;
	string title = 4;
	string content = 5;
	repeated string image_urls = 6;
}

message DeleteReviewRequest {
	string review_id = 1;
	string customer_id = 2;
}

message DeleteReviewByAdminRequest {
	string review_id = 1;
	string admin_id = 2;
	string reason = 3;
}

message GetReviewsByProductRequest {
	string product_id = 1;
	string sort_by = 2;
	int32 page = 3;
	int32 page_size = 4;
}

message GetReviewDetailRequest {
	string review_id = 1;
}

message GetMyReviewsRequest {
	string customer_id = 1;
}

message GetProductRatingRequest {
	string product_id = 1;
}

message RecalculateProductRatingRequest {
	string product_id = 1;
}

message ApprovePendingReviewsRequest {
	string admin_id = 1;
	int32 page = 2;
	int32 page_size = 3;
}

message ApproveReviewRequest {
	string review_id = 1;
	string admin_id = 2;
}

message RejectReviewRequest {
	string review_id = 1;
	string admin_id = 2;
	string reason = 3;
}

message MarkReviewHelpfulRequest {
	string review_id = 1;
	string user_id = 2;
}

message UnmarkReviewHelpfulRequest {
	string review_id = 1;
	string user_id = 2;
}

message PostShopReplyRequest {
	string review_id = 1;
	string shop_id = 2;
	string content = 3;
}

message UpdateShopReplyRequest {
	string reply_id = 1;
	string shop_id = 2;
	string content = 3;
}

message DeleteShopReplyRequest {
	string reply_id = 1;
	string shop_id = 2;
}

message ReportReviewRequest {
	string review_id = 1;
	string reporter_id = 2;
	ReportReason reason = 3;
	string description = 4;
}

message GetReviewReportsRequest {
	string admin_id = 1;
	ReportStatus status = 2;
	int32 page = 3;
	int32 page_size = 4;
}

message ResolveReviewReportRequest {
	string report_id = 1;
	string admin_id = 2;
	string action = 3;
	string note = 4;
}

service ReviewService  {
	rpc PostReview(PostReviewRequest) returns (PostReviewResponse);
	rpc UpdateReview(UpdateReviewRequest) returns (UpdateReviewResponse);
	rpc DeleteReview(DeleteReviewRequest) returns (DeleteReviewResponse);
	rpc DeleteReviewByAdmin(DeleteReviewByAdminRequest) returns (DeleteReviewByAdminResponse);
	rpc GetReviewsByProduct(GetReviewsByProductRequest) returns (GetReviewsByProductResponse);
	rpc GetReviewDetail(GetReviewDetailRequest) returns (GetReviewDetailResponse);
	rpc GetMyReviews(GetMyReviewsRequest) returns (GetMyReviewsResponse);
	rpc GetProductRating(GetProductRatingRequest) returns (GetProductRatingResponse);
	rpc GetPendingReviews(GetPendingReviewsRequest) returns (GetPendingReviewsResponse);
	rpc ApproveReview(ApproveReviewRequest) returns (ApproveReviewResponse);
	rpc RejectReview(RejectReviewRequest) returns (RejectReviewResponse);
	rpc MarkReviewHelpful(MarkReviewHelpfulRequest) returns (MarkReviewHelpfulResponse);
	rpc UnmarkReviewHelpful(UnmarkReviewHelpfulRequest) returns (UnmarkReviewHelpfulResponse);
	rpc PostShopReply(PostShopReplyRequest) returns (PostShopReplyResponse);
	rpc UpdateShopReply(UpdateShopReplyRequest) returns (UpdateShopReplyResponse);
	rpc DeleteShopReply(DeleteShopReplyRequest) returns (DeleteShopReplyResponse);
	rpc ReportReview(ReportReviewRequest) returns (ReportReviewResponse);
	rpc GetReviewReports(GetReviewReportsRequest) returns (GetReviewReportsResponse);
	rpc ResolveReviewReport(ResolveReviewReportRequest) returns (ResolveReviewReportResponse);
}
