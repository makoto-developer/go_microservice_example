syntax = "proto3";

package chat_service.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/chat_service/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum RoomStatus {
	ROOM_STATUS_UNSPECIFIED = 0;
	ACTIVE = 1;
	RESOLVED = 2;
	CLOSED = 3;
}

enum MessageType {
	MESSAGE_TYPE_UNSPECIFIED = 0;
	TEXT = 1;
	IMAGE = 2;
	FILE = 3;
}

enum PresenceStatus {
	PRESENCE_STATUS_UNSPECIFIED = 0;
	ONLINE = 1;
	OFFLINE = 2;
	AWAY = 3;
}

message ChatRoom {
	string id = 1;
	string customer_id = 2;
	string shop_id = 3;
	string product_id = 4;
	RoomStatus status = 5;
	google.protobuf.Timestamp last_message_at = 6;
	google.protobuf.Timestamp created_at = 7;
	google.protobuf.Timestamp updated_at = 8;
}

message Message {
	string id = 1;
	string room_id = 2;
	string sender_id = 3;
	string receiver_id = 4;
	MessageType message_type = 5;
	text content = 6;
	string file_url = 7;
	string file_name = 8;
	int32 file_size = 9;
	bool is_read = 10;
	google.protobuf.Timestamp read_at = 11;
	google.protobuf.Timestamp created_at = 12;
}

message UserPresence {
	string id = 1;
	string user_id = 2;
	PresenceStatus status = 3;
	google.protobuf.Timestamp last_active_at = 4;
	string device_info = 5;
	google.protobuf.Timestamp created_at = 6;
	google.protobuf.Timestamp updated_at = 7;
}

message TypingIndicator {
	string id = 1;
	string room_id = 2;
	string user_id = 3;
	google.protobuf.Timestamp expires_at = 4;
	google.protobuf.Timestamp created_at = 5;
}

message MessageArchive {
	string id = 1;
	string room_id = 2;
	int32 message_count = 3;
	string archive_url = 4;
	google.protobuf.Timestamp archived_from = 5;
	google.protobuf.Timestamp archived_to = 6;
	google.protobuf.Timestamp created_at = 7;
}

message CreateChatRoomRequest {
	string customer_id = 1;
	string shop_id = 2;
	string product_id = 3;
}

message GetChatRoomsRequest {
	string user_id = 1;
	string user_role = 2;
	RoomStatus status_filter = 3;
}

message GetChatRoomDetailRequest {
	string room_id = 1;
	string user_id = 2;
}

message UpdateRoomStatusRequest {
	string room_id = 1;
	string user_id = 2;
	RoomStatus new_status = 3;
}

message SendMessageRequest {
	string room_id = 1;
	string sender_id = 2;
	string receiver_id = 3;
	MessageType message_type = 4;
	string content = 5;
	string file_url = 6;
	string file_name = 7;
	int32 file_size = 8;
}

message GetMessagesRequest {
	string room_id = 1;
	string user_id = 2;
	int32 page = 3;
	int32 page_size = 4;
}

message MarkMessagesAsReadRequest {
	string room_id = 1;
	string user_id = 2;
	repeated string message_ids = 3;
}

message SearchMessagesRequest {
	string room_id = 1;
	string user_id = 2;
	string keyword = 3;
	date date_from = 4;
	date date_to = 5;
}

message UploadChatImageRequest {
	string room_id = 1;
	string user_id = 2;
	bytes image_data = 3;
}

message UploadChatFileRequest {
	string room_id = 1;
	string user_id = 2;
	bytes file_data = 3;
	string file_name = 4;
}

message UpdatePresenceRequest {
	string user_id = 1;
	PresenceStatus status = 2;
	string device_info = 3;
}

message GetUserPresenceRequest {
	string user_id = 1;
}

message StartTypingRequest {
	string room_id = 1;
	string user_id = 2;
}

message StopTypingRequest {
	string room_id = 1;
	string user_id = 2;
}

message ArchiveOldMessagesRequest {
	int32 days_threshold = 1;
}

message GetArchivedMessagesRequest {
	string room_id = 1;
	string user_id = 2;
	date date_from = 3;
	date date_to = 4;
}

service ChatService  {
	rpc CreateChatRoom(CreateChatRoomRequest) returns (CreateChatRoomResponse);
	rpc GetChatRooms(GetChatRoomsRequest) returns (GetChatRoomsResponse);
	rpc GetChatRoomDetail(GetChatRoomDetailRequest) returns (GetChatRoomDetailResponse);
	rpc UpdateRoomStatus(UpdateRoomStatusRequest) returns (UpdateRoomStatusResponse);
	rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
	rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
	rpc MarkMessagesAsRead(MarkMessagesAsReadRequest) returns (MarkMessagesAsReadResponse);
	rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
	rpc UploadChatImage(UploadChatImageRequest) returns (UploadChatImageResponse);
	rpc UploadChatFile(UploadChatFileRequest) returns (UploadChatFileResponse);
	rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
	rpc GetUserPresence(GetUserPresenceRequest) returns (GetUserPresenceResponse);
	rpc GetArchivedMessages(GetArchivedMessagesRequest) returns (GetArchivedMessagesResponse);
}
