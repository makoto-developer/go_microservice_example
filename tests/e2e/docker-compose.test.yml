version: '3.8'

# E2E Test Environment Configuration
# This docker-compose file sets up a complete test environment for E2E testing

services:
  # ==========================================
  # Test Databases
  # ==========================================

  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: testuser
      RABBITMQ_DEFAULT_PASS: testpass
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # ==========================================
  # Test Services (Simplified)
  # ==========================================

  auth-service-test:
    build:
      context: ../../simple-servers/auth
      dockerfile: Dockerfile
    environment:
      - PORT=8081
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=testuser
      - DB_PASSWORD=testpass
      - DB_NAME=test_auth
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET=test-secret-key
    ports:
      - "8081:8081"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-network

  customer-service-test:
    build:
      context: ../../simple-servers/customer
      dockerfile: Dockerfile
    environment:
      - PORT=8083
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=testuser
      - DB_PASSWORD=testpass
      - DB_NAME=test_customer
    ports:
      - "8083:8083"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test-network

  shop-service-test:
    build:
      context: ../../simple-servers/shop
      dockerfile: Dockerfile
    environment:
      - PORT=8082
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=testuser
      - DB_PASSWORD=testpass
      - DB_NAME=test_shop
    ports:
      - "8082:8082"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test-network

  # ==========================================
  # Test Data Initialization
  # ==========================================

  test-data-init:
    image: postgres:15-alpine
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./test-data:/test-data
    command: >
      sh -c "
        echo 'Initializing test data...' &&
        sleep 5 &&
        echo 'Test data initialized successfully'
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  postgres-test-data:
  redis-test-data:
