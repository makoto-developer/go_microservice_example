// 変更時は protoc で pb.go を再生成すること。
syntax = "proto3";

package payment_service.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/makoto-developer/go_microservice_example/microservices/payment/proto;v1";

service PaymentService {
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (CreatePaymentIntentResponse);
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (ConfirmPaymentResponse);
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (GetPaymentStatusResponse);
  rpc CreateCODPayment(CreateCODPaymentRequest) returns (CreateCODPaymentResponse);
  rpc ConfirmCODPayment(ConfirmCODPaymentRequest) returns (ConfirmCODPaymentResponse);
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);
  rpc GetRefundStatus(GetRefundStatusRequest) returns (GetRefundStatusResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  rpc GetPaymentDetail(GetPaymentDetailRequest) returns (GetPaymentDetailResponse);
}

enum PaymentMethodType {
  PAYMENT_METHOD_TYPE_UNSPECIFIED = 0;
  CREDIT_CARD = 1;
  CASH_ON_DELIVERY = 2;
}

enum PaymentStatus {
  PAYMENT_STATUS_PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_REQUIRES_AUTHENTICATION = 3;
  PAYMENT_STATUS_SUCCEEDED = 4;
  PAYMENT_STATUS_FAILED = 5;
  PAYMENT_STATUS_REFUNDING = 6;
  PAYMENT_STATUS_REFUNDED = 7;
}

enum RefundStatus {
  REFUND_STATUS_REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_PENDING = 1;
  REFUND_STATUS_PROCESSING = 2;
  REFUND_STATUS_SUCCEEDED = 3;
  REFUND_STATUS_FAILED = 4;
}

message Payment {
  string id = 1;
  string order_id = 2;
  PaymentMethodType payment_method = 3;
  string amount = 4;
  string currency = 5;
  PaymentStatus status = 6;
  string stripe_payment_intent_id = 7;
  string stripe_client_secret = 8;
  bool requires_authentication = 9;
  string authentication_url = 10;
  string error_code = 11;
  string error_message = 12;
  string cod_fee = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message Refund {
  string id = 1;
  string payment_id = 2;
  string order_id = 3;
  string amount = 4;
  string reason = 5;
  RefundStatus status = 6;
  string stripe_refund_id = 7;
  string error_message = 8;
  google.protobuf.Timestamp refunded_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message WebhookEvent {
  string id = 1;
  string stripe_event_id = 2;
  string event_type = 3;
  string payload = 4;
  bool processed = 5;
  google.protobuf.Timestamp processed_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message PaymentHistory {
  string id = 1;
  string payment_id = 2;
  PaymentStatus old_status = 3;
  PaymentStatus new_status = 4;
  string changed_by = 5;
  string change_reason = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreatePaymentIntentRequest {
  string order_id = 1;
  string amount = 2;
  string currency = 3;
  string payment_method_id = 4;
  string customer_id = 5;
}

message ConfirmPaymentRequest {
  string payment_id = 1;
  string payment_intent_id = 2;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
}

message CreateCODPaymentRequest {
  string order_id = 1;
  string amount = 2;
}

message ConfirmCODPaymentRequest {
  string payment_id = 1;
  string order_id = 2;
}

message CreateRefundRequest {
  string payment_id = 1;
  string order_id = 2;
  string amount = 3;
  string reason = 4;
}

message GetRefundStatusRequest {
  string refund_id = 1;
}

message ListPaymentsRequest {
  string order_id = 1;
  string customer_id = 2;
  string shop_id = 3;
  repeated PaymentStatus status_filter = 4;
  string date_from = 5;
  string date_to = 6;
  PaymentMethodType payment_method = 7;
  int32 page = 8;
  int32 page_size = 9;
}

message GetPaymentDetailRequest {
  string payment_id = 1;
  string requester_id = 2;
  string requester_role = 3;
}

message HandleStripeWebhookRequest {
  string stripe_signature = 1;
  string payload = 2;
}

message ProcessPaymentIntentSucceededRequest {
  string payment_intent_id = 1;
  string amount = 2;
}

message ProcessPaymentIntentFailedRequest {
  string payment_intent_id = 1;
  string error_code = 2;
  string error_message = 3;
}

message ProcessRefundCompletedRequest {
  string refund_id = 1;
  string amount = 2;
}

message CreatePaymentIntentResponse {
  string payment_id = 1;
  string client_secret = 2;
  string message = 3;
}

message ConfirmPaymentResponse {
  bool success = 1;
  PaymentStatus status = 2;
  string message = 3;
}

message GetPaymentStatusResponse {
  PaymentStatus status = 1;
  string transaction_id = 2;
}

message CreateCODPaymentResponse {
  string payment_id = 1;
  string message = 2;
}

message ConfirmCODPaymentResponse {
  bool success = 1;
  string message = 2;
}

message CreateRefundResponse {
  string refund_id = 1;
  string message = 2;
}

message GetRefundStatusResponse {
  RefundStatus status = 1;
  int64 refund_amount = 2;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32 total_count = 2;
}

message GetPaymentDetailResponse {
  Payment payment = 1;
}
