syntax = "proto3";

package shop_service.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/generated/shop/proto/shop_service/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum ShopStatus {
	SHOP_STATUS_UNSPECIFIED = 0;
	PENDING_APPROVAL = 1;
	APPROVED = 2;
	REJECTED = 3;
	SUSPENDED = 4;
}

enum OrderStatus {
	ORDER_STATUS_UNSPECIFIED = 0;
	RECEIVED = 1;
	PREPARING = 2;
	SHIPPED = 3;
	DELIVERED = 4;
	CANCELLED = 5;
}

enum Carrier {
	CARRIER_UNSPECIFIED = 0;
	YAMATO = 1;
	SAGAWA = 2;
	JAPAN_POST = 3;
}

message Shop {
	string id = 1;
	string owner_id = 2;
	string name = 3;
	string description = 4;
	string logo_url = 5;
	string owner_name = 6;
	string phone_number = 7;
	string business_hours = 8;
	string return_policy = 9;
	ShopStatus status = 10;
	bool published = 11;
	google.protobuf.Timestamp created_at = 12;
	google.protobuf.Timestamp updated_at = 13;
}

message ShopCategory {
	string id = 1;
	string shop_id = 2;
	string category_name = 3;
	google.protobuf.Timestamp created_at = 4;
}

message Product {
	string id = 1;
	string shop_id = 2;
	string name = 3;
	string description = 4;
	string price = 5;
	string category = 6;
	int32 stock_quantity = 7;
	string weight = 8;
	string size = 9;
	string jan_code = 10;
	bool published = 11;
	bool deleted = 12;
	google.protobuf.Timestamp created_at = 13;
	google.protobuf.Timestamp updated_at = 14;
}

message ProductImage {
	string id = 1;
	string product_id = 2;
	string url = 3;
	int32 display_order = 4;
	string thumbnail_200_url = 5;
	string thumbnail_400_url = 6;
	string thumbnail_800_url = 7;
	google.protobuf.Timestamp created_at = 8;
}

message ProductTag {
	string id = 1;
	string product_id = 2;
	string tag_name = 3;
	google.protobuf.Timestamp created_at = 4;
}

message ProductVariation {
	string id = 1;
	string product_id = 2;
	string sku = 3;
	string attribute_name = 4;
	string attribute_value = 5;
	string price = 6;
	int32 stock_quantity = 7;
	google.protobuf.Timestamp created_at = 8;
	google.protobuf.Timestamp updated_at = 9;
}

message Order {
	string id = 1;
	string shop_id = 2;
	string customer_id = 3;
	string order_number = 4;
	OrderStatus status = 5;
	string total_amount = 6;
	string shipping_address = 7;
	string payment_method = 8;
	string tracking_number = 9;
	Carrier carrier = 10;
	google.protobuf.Timestamp created_at = 11;
	google.protobuf.Timestamp updated_at = 12;
}

message OrderItem {
	string id = 1;
	string order_id = 2;
	string product_id = 3;
	string product_name = 4;
	int32 quantity = 5;
	string unit_price = 6;
	string subtotal = 7;
	google.protobuf.Timestamp created_at = 8;
}

message SalesReport {
	string id = 1;
	string shop_id = 2;
	string date = 3;  // Format: YYYY-MM-DD
	string total_sales = 4;
	int32 order_count = 5;
	string average_order_value = 6;
	google.protobuf.Timestamp created_at = 7;
}

message RegisterShopRequest {
	string owner_id = 1;
	string name = 2;
	string description = 3;
	string logo_url = 4;
	string owner_name = 5;
	string phone_number = 6;
	string business_hours = 7;
	string return_policy = 8;
	repeated string categories = 9;
}

message UpdateShopRequest {
	string shop_id = 1;
	string name = 2;
	string description = 3;
	string logo_url = 4;
	string business_hours = 5;
	string return_policy = 6;
}

message GetShopRequest {
	string shop_id = 1;
}

message ListShopsRequest {
	bool published_only = 1;
	int32 limit = 2;
	int32 offset = 3;
}

message ListShopsResponse {
	repeated Shop shops = 1;
	int32 total_count = 2;
}

message GetShopsByOwnerRequest {
	string owner_id = 1;
}

message ToggleShopPublishRequest {
	string shop_id = 1;
	bool published = 2;
}

message RegisterProductRequest {
	string shop_id = 1;
	string name = 2;
	string description = 3;
	string price = 4;
	string category = 5;
	int32 stock_quantity = 6;
	string weight = 7;
	string size = 8;
	string jan_code = 9;
	repeated string tags = 10;
}

message UpdateProductRequest {
	string product_id = 1;
	string name = 2;
	string description = 3;
	string price = 4;
	string category = 5;
	int32 stock_quantity = 6;
	string weight = 7;
	string size = 8;
	string jan_code = 9;
}

message DeleteProductRequest {
	string product_id = 1;
}

message ToggleProductPublishRequest {
	string product_id = 1;
	bool published = 2;
}

message GetProductRequest {
	string product_id = 1;
}

message ListProductsRequest {
	string shop_id = 1;
	string category = 2;
	bool published_only = 3;
	int32 limit = 4;
	int32 offset = 5;
}

message UploadProductImageRequest {
	string product_id = 1;
	bytes image_data = 2;
	int32 display_order = 3;
}

message ManageVariationRequest {
	string product_id = 1;
	repeated ProductVariationInput variations = 2;
}

message ListOrdersRequest {
	string shop_id = 1;
	OrderStatus status = 2;
	string date_from = 3;  // Format: YYYY-MM-DD
	string date_to = 4;    // Format: YYYY-MM-DD
	string customer_name = 5;
	string product_name = 6;
	string sort_by = 7;
	string sort_order = 8;
}

message GetOrderDetailRequest {
	string order_id = 1;
	string shop_id = 2;
}

message UpdateOrderStatusRequest {
	string order_id = 1;
	string shop_id = 2;
	OrderStatus new_status = 3;
	string tracking_number = 4;
	Carrier carrier = 5;
}

message GetSalesReportRequest {
	string shop_id = 1;
	string report_type = 2;
	string date_from = 3;  // Format: YYYY-MM-DD
	string date_to = 4;    // Format: YYYY-MM-DD
}

message ExportSalesDataRequest {
	string shop_id = 1;
	string date_from = 2;  // Format: YYYY-MM-DD
	string date_to = 3;    // Format: YYYY-MM-DD
}

// Helper messages
message ProductVariationInput {
	string sku = 1;
	string attribute_name = 2;
	string attribute_value = 3;
	string price = 4;
	int32 stock_quantity = 5;
}

message OrderSummary {
	string id = 1;
	string order_number = 2;
	OrderStatus status = 3;
	string total_amount = 4;
	google.protobuf.Timestamp created_at = 5;
}

message OrderDetail {
	Order order = 1;
	repeated OrderItem items = 2;
}

message SalesData {
	string date = 1;
	string total_sales = 2;
	int32 order_count = 3;
	string average_order_value = 4;
}

message SalesSummary {
	string total_sales = 1;
	int32 total_orders = 2;
	string average_order_value = 3;
}

// Response messages
message RegisterShopResponse {
	string shop_id = 1;
	ShopStatus status = 2;
	string message = 3;
}

message UpdateShopResponse {
	string shop_id = 1;
	bool requires_reapproval = 2;
}

message ToggleShopPublishResponse {
	string shop_id = 1;
	bool published = 2;
}

message GetShopResponse {
	Shop shop = 1;
}

message RegisterProductResponse {
	string product_id = 1;
}

message UpdateProductResponse {
	string product_id = 1;
}

message DeleteProductResponse {
	string product_id = 1;
	bool deleted = 2;
}

message ToggleProductPublishResponse {
	string product_id = 1;
	bool published = 2;
}

message GetProductResponse {
	Product product = 1;
}

message ListProductsResponse {
	repeated Product products = 1;
	int32 total_count = 2;
}

message UploadProductImageResponse {
	string image_id = 1;
	string url = 2;
	map<string, string> thumbnails = 3;
}

message ManageVariationResponse {
	repeated string variation_ids = 1;
}

message ListOrdersResponse {
	repeated OrderSummary orders = 1;
	int32 total_count = 2;
}

message GetOrderDetailResponse {
	OrderDetail order = 1;
}

message UpdateOrderStatusResponse {
	string order_id = 1;
	OrderStatus status = 2;
}

message GetSalesReportResponse {
	repeated SalesData report_data = 1;
	SalesSummary summary = 2;
}

message ExportSalesDataResponse {
	string csv_url = 1;
	google.protobuf.Timestamp expires_at = 2;
}

service ShopService  {
	rpc RegisterShop(RegisterShopRequest) returns (RegisterShopResponse);
	rpc UpdateShop(UpdateShopRequest) returns (UpdateShopResponse);
	rpc ToggleShopPublish(ToggleShopPublishRequest) returns (ToggleShopPublishResponse);
	rpc GetShop(GetShopRequest) returns (GetShopResponse);
	rpc ListShops(ListShopsRequest) returns (ListShopsResponse);
	rpc GetShopsByOwner(GetShopsByOwnerRequest) returns (ListShopsResponse);
	rpc RegisterProduct(RegisterProductRequest) returns (RegisterProductResponse);
	rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
	rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
	rpc ToggleProductPublish(ToggleProductPublishRequest) returns (ToggleProductPublishResponse);
	rpc GetProduct(GetProductRequest) returns (GetProductResponse);
	rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
	rpc UploadProductImage(UploadProductImageRequest) returns (UploadProductImageResponse);
	rpc ManageVariation(ManageVariationRequest) returns (ManageVariationResponse);
	rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
	rpc GetOrderDetail(GetOrderDetailRequest) returns (GetOrderDetailResponse);
	rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
	rpc GetSalesReport(GetSalesReportRequest) returns (GetSalesReportResponse);
	rpc ExportSalesData(ExportSalesDataRequest) returns (ExportSalesDataResponse);
}
