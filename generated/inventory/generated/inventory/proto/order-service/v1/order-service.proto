syntax = "proto3";

package order.v1;

option go_package = "github.com/makoto-developer/go_microservice_example/proto/order-service/v1;orderv1";

import "google/protobuf/timestamp.proto";

// Order Service
service OrderService {
  // Create a new order
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  
  // Get order details
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  
  // Get orders for a customer
  rpc GetCustomerOrders(GetCustomerOrdersRequest) returns (GetCustomerOrdersResponse);
  
  // Cancel an order
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

// Enums
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  SHIPPED = 3;
  DELIVERED = 4;
  CANCELLED = 5;
}

// Messages
message Order {
  string id = 1;
  string customer_id = 2;
  string order_number = 3;
  OrderStatus status = 4;
  int32 total_amount = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message OrderItem {
  string id = 1;
  string order_id = 2;
  string product_id = 3;
  string shop_id = 4;
  int32 quantity = 5;
  int32 price = 6;
  google.protobuf.Timestamp created_at = 7;
}

// CreateOrder
message OrderItemInput {
  string product_id = 1;
  string shop_id = 2;
  int32 quantity = 3;
  int32 price = 4;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItemInput items = 2;
}

message CreateOrderResponse {
  string order_id = 1;
  string order_number = 2;
  int32 total_amount = 3;
  string message = 4;
}

// GetOrder
message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
  repeated OrderItem items = 2;
  string message = 3;
}

// GetCustomerOrders
message GetCustomerOrdersRequest {
  string customer_id = 1;
}

message GetCustomerOrdersResponse {
  repeated Order orders = 1;
  string message = 2;
}

// CancelOrder
message CancelOrderRequest {
  string order_id = 1;
}

message CancelOrderResponse {
  bool cancelled = 1;
  string message = 2;
}
